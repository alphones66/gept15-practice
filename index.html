<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日15字</title>
<link rel="manifest" href="gept15-manifest.json">
<meta name="theme-color" content="#f8c9b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" href="app-icon-192.png">
<style>
:root { --orange:#f06a1f; --ink:#3a2a1a; --green:#4caf50; --red:#e57373; --blue:#2f80ed; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; background:#fbeee4; color:var(--ink); min-height:100vh; padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font-family:inherit; cursor:pointer; }
header { position:sticky; top:0; z-index:10; background:#f8c9b0; padding:10px 14px; display:flex; align-items:center; gap:10px; }
header a { color:var(--ink); text-decoration:none; font-size:15px; background:#fff; border-radius:10px; padding:6px 12px; }
header h1 { margin:0; font-size:18px; flex:1; }
main { max-width:640px; margin:0 auto; padding:14px; }
.box { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
.box h2 { margin:0 0 10px; font-size:19px; }
.big { display:block; width:100%; font-size:21px; padding:15px; border:0; border-radius:14px; background:var(--orange); color:#fff; margin-top:10px; text-align:left; }
.big small { display:block; font-size:14px; font-weight:normal; opacity:.9; margin-top:2px; }
.big.alt { background:#fff; color:var(--ink); border:2px solid var(--orange); }
.big.green { background:var(--green); }
.big.blue { background:var(--blue); }
.big.done { background:#e8f5e9; color:#2e7d32; border:2px solid #a5d6a7; }
.big:disabled { opacity:.4; }
.mini { font-size:15px; padding:7px 13px; border:2px solid var(--orange); background:#fff; border-radius:10px; color:var(--ink); }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.grow { flex:1; }
.prog { height:12px; background:#f3d9c6; border-radius:6px; overflow:hidden; margin:8px 0; }
.prog > div { height:100%; background:var(--green); transition:width .3s; }
.hint { font-size:15px; color:#8a6a50; line-height:1.6; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips span { background:#fdf1e6; border-radius:10px; padding:5px 10px; font-size:16px; }
.chips span.ok { background:#e8f5e9; }
.chips span.again { background:#fff3cd; }
/* 單字卡 */
.card { text-align:center; }
.card .emo { font-size:72px; line-height:1.1; min-height:80px; }
.card .en { font-size:48px; font-weight:bold; margin:4px 0; word-break:break-all; }
.card .pos { display:inline-block; background:#fdf1e6; border-radius:8px; padding:2px 10px; font-size:16px; color:#8a6a50; }
.card .zh { font-size:28px; margin:8px 0; }
.card .ex { text-align:left; background:#fdf1e6; border-radius:12px; padding:12px; margin-top:10px; font-size:18px; line-height:1.6; }
.card .ex small { color:#8a6a50; display:block; }
.say { border:0; background:var(--blue); color:#fff; border-radius:14px; font-size:20px; padding:10px 18px; margin:4px; }
.nav { display:flex; gap:10px; }
.nav button { flex:1; }
/* 題目 */
.qnum { font-size:15px; color:#8a6a50; }
.qtext { font-size:26px; line-height:1.5; margin:8px 0 14px; text-align:center; }
.qtext .emo { font-size:56px; display:block; }
.qtext .w { font-size:44px; font-weight:bold; display:block; }
.opt { display:block; width:100%; text-align:left; font-size:22px; padding:14px; margin-bottom:10px; background:#fdf1e6; border:2px solid transparent; border-radius:14px; color:var(--ink); }
.opt.right { background:#e8f5e9; border-color:#66bb6a; }
.opt.wrong { background:#fff3cd; border-color:#ffca28; }
.say2 { text-align:center; margin:6px 0 12px; }
.slots { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin:10px 0; min-height:54px; }
.slots span { min-width:38px; height:48px; border-bottom:4px solid #bcaaa4; font-size:32px; font-weight:bold; text-align:center; line-height:48px; }
.tiles { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:12px 0; }
.tiles button { width:52px; height:56px; font-size:28px; font-weight:bold; border:2px solid var(--orange); background:#fff; border-radius:12px; color:var(--ink); }
.tiles button:disabled { opacity:.25; }
.fb { text-align:center; font-size:24px; margin:10px 0; min-height:36px; }
.score { font-size:58px; text-align:center; color:var(--orange); font-weight:bold; margin:2px 0; }
.msg { text-align:center; font-size:24px; margin-bottom:8px; }
/* 記錄 */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(26px,1fr)); gap:4px; }
.grid i { display:block; height:26px; border-radius:6px; background:#eee; font-style:normal; font-size:11px; text-align:center; line-height:26px; color:#999; }
.grid i.d { background:#a5d6a7; color:#1b5e20; }
.grid i.l { background:#ffe082; color:#6d4c00; }
.grid i.cur { outline:3px solid var(--orange); }
table { width:100%; border-collapse:collapse; font-size:16px; }
th,td { text-align:left; padding:7px 4px; border-top:1px solid #f0e0d2; }
select { font-size:17px; padding:6px; border-radius:8px; }
</style>
</head>
<body>
<header><a href="./">🏠</a><h1>📅 每日 15 字</h1><a href="https://alphones66.github.io/english-writing/" id="toWrite">✍️ 寫字</a></header>
<main id="app"></main>

<script src="gept-elementary.js"></script>
<script src="gept-examples.js"></script>
<script src="gept-emoji.js"></script>
<script src="gept-order.js"></script>
<script>
'use strict';
const PER = 15;                                                    // 每天新學幾個字
const ALPHA = (window.GEPT_ELEMENTARY || []).map(([w, pos, zh]) => ({ w, pos, zh, short: zh.split(/[；、]/)[0] }));
const ORD = window.GEPT_ORDER || null;             // 國一、國二課本常用的字先練（tools/build_gept_order.py 從教材統計）
const BOOK = ORD ? ORD.book : {}, VOCAB = new Set(ORD ? ORD.vocab : []);
let WORDS = ALPHA;
function applyOrder(mode) {
  if (mode === 'book' && ORD) { const m = new Map(ALPHA.map(x => [x.w, x])); WORDS = ORD.order.map(w => m.get(w)).filter(Boolean); }
  else WORDS = ALPHA;
}
const EX = window.GEPT_EXAMPLES || {}, PIC = window.GEPT_EMOJI || {};
const TOTAL_DAYS = Math.ceil(ALPHA.length / PER);
const BOX_DAYS = [1, 2, 4, 7, 15, 30];                              // 答對後，隔幾天再複習
const $app = document.getElementById('app');
function writeWordUrl(word, day, index) {
  const url = new URL('https://alphones66.github.io/english-writing/');
  url.searchParams.set('word', word);
  url.searchParams.set('back', 'https://alphones66.github.io/gept15-practice/');
  url.searchParams.set('day', day);
  url.searchParams.set('i', index);
  return url.href;
}
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const WMAP = new Map(ALPHA.map(x => [x.w, x]));
const inBook = w => VOCAB.has(w) || !!BOOK[w];

// ---------- 存檔：存在目前裝置的瀏覽器 ----------
function Store(name, init) {
  return {
    name, key: 'gept15-' + name, data: init(), init,
    load() {
      let l = null;
      try { l = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (_) {}
      this.data = (l && l.data) || this.init();
    },
    save() {
      try { localStorage.setItem(this.key, JSON.stringify({ data: this.data })); } catch (_) {}
    },
  };
}
// 進度：done[天]={date,score}；prog[天]={cards,practice,test}；view＝現在看第幾天
const plan = Store('gept-plan', () => ({ version: 1, start: dstr(), per: PER, done: {}, prog: {}, extraToday: '', order: ORD ? 'book' : 'abc' }));
// 練習記錄：每個字的次數與複習時間、每次練習一筆
const prac = Store('gept-practice', () => ({ version: 1, words: {}, sessions: [] }));
// 測驗記錄：每次測驗一筆，含每一題的作答
const quiz = Store('gept-quiz', () => ({ version: 1, tests: [] }));

const today = () => dstr();
const dayWords = n => WORDS.slice((n - 1) * PER, n * PER);
function currentDay() { let n = 1; while (plan.data.done[n] && n <= TOTAL_DAYS) n++; return Math.min(n, TOTAL_DAYS); }
function allDone() { return !!plan.data.done[TOTAL_DAYS]; }
function newDayOk() { const last = plan.data.done[currentDay() - 1]; return !(last && last.date === today()) || plan.data.extraToday === today() || allDone(); }
let viewDay = null;
const getView = () => viewDay ?? (newDayOk() ? currentDay() : Math.max(1, currentDay() - 1));
const pg = n => plan.data.prog[n] || (plan.data.prog[n] = {});
const ws = w => prac.data.words[w] || (prac.data.words[w] = { seen: 0, right: 0, wrong: 0, box: 0, due: '', last: '' });

function dueWords() {   // 今天該複習的字：到期的、考試寫錯的
  const t = today();
  return Object.entries(prac.data.words).filter(([w, s]) => WMAP.has(w) && s.due && s.due <= t).sort((a, b) => a[1].due.localeCompare(b[1].due)).map(([w]) => w);
}

// ---------- 發音 ----------
let spoke = false, enVoices = [];
function loadVoices() { try { enVoices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (_) {} }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {}
function speak(text) {
  try {
    if (spoke) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .85;
    const v = enVoices.find(v => /en[-_]US/i.test(v.lang)) || enVoices[0]; if (v) { u.voice = v; u.lang = v.lang; }
    spoke = true; speechSynthesis.speak(u);
  } catch (_) {}
}
// 完整唸一個單字：整個字 → 一個一個字母 → 再唸一次整個字 → 中文意思（例：the、T H E、the、這個那個）
function speakFull(x) {
  try {
    if (spoke) speechSynthesis.cancel();
    const en = enVoices.find(v => /en[-_]US/i.test(v.lang)) || enVoices[0];
    const zhv = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    const letters = [...x.w].filter(c => /[A-Za-z]/.test(c)).map(c => c.toUpperCase());
    const zh = x.zh.split('；')[0].replace(/[()（）]/g, '');
    const parts = [[x.w, 'en', .85], [letters.join(', '), 'en', .7], [x.w, 'en', .85], [zh, 'zh', .9]];
    spoke = true;
    parts.forEach(([text, lang, rate]) => {
      if (!text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'zh-TW'; u.rate = rate;
      const v = lang === 'en' ? en : zhv; if (v) { u.voice = v; u.lang = v.lang; }
      speechSynthesis.speak(u);
    });
  } catch (_) {}
}
function hush() { try { if (spoke) { spoke = false; speechSynthesis.cancel(); } } catch (_) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) hush(); });
window.addEventListener('pagehide', hush);

// ---------- 首頁 ----------
function home() {
  hush();
  const cd = currentDay(), v = getView(), ws0 = dayWords(v), p = pg(v), t = today();
  const nDone = Object.keys(plan.data.done).length, due = dueWords();
  const isNew = v === cd && !plan.data.done[v];
  const step = (k, label, sub, act) => `<button class="big ${p[k] ? 'done' : ''}" data-act="${act}">${p[k] ? '✔ ' : ''}${label}<small>${sub}</small></button>`;
  const days = Array.from({ length: TOTAL_DAYS }, (_, i) => i + 1);
  $app.innerHTML = `
    <section class="box">
      <div class="row"><h2 class="grow" style="margin:0">第 ${v} 天 <span style="font-size:15px;color:#8a6a50">／共 ${TOTAL_DAYS} 天</span></h2>
        <select id="dayPick" aria-label="換一天">${days.filter(n => n <= cd || plan.data.done[n]).map(n => `<option value="${n}" ${n === v ? 'selected' : ''}>第 ${n} 天${plan.data.done[n] ? ' ✔' : ''}</option>`).join('')}</select></div>
      <div class="prog"><div style="width:${nDone / TOTAL_DAYS * 100}%"></div></div>
      <div class="hint">已經完成 ${nDone} 天，學過 ${Math.min(nDone * PER, WORDS.length)} 個字，一共 ${WORDS.length} 個字。每天新學 ${PER} 個字。<br>${plan.data.order === 'book' ? `順序：國一、國二課本常用的字先練（前 ${Math.ceil(ORD.n.inbook / PER)} 天）。` : '順序：字母順序。'}</div>
    </section>
    ${!newDayOk() && getView() < cd ? `<section class="box"><div class="msg">🎉 今天的 ${PER} 個字完成了！</div><div class="hint" style="text-align:center">明天再學第 ${cd} 天。想多學一點，可以按下面。</div><button class="big alt" data-act="extra">多學一組（第 ${cd} 天）</button></section>` : ''}
    ${allDone() ? `<section class="box"><div class="msg">🏆 全部 ${TOTAL_DAYS} 天都完成了！</div></section>` : ''}
    <section class="box">
      <h2>今天的 ${ws0.length} 個字</h2>
      <div class="chips">${ws0.map(x => { const s = prac.data.words[x.w] || {}; return `<span class="${s.box > 0 ? 'ok' : s.wrong && s.box === 0 && s.last ? 'again' : ''}">${esc(x.w)}</span>`; }).join('')}</div>
    </section>
    <section class="box">
      <h2>今天的步驟</h2>
      ${step('cards', '① 認識這 ' + ws0.length + ' 個字', '看圖、聽發音、看例句，每個字可以接著練寫字', 'cards')}
      ${step('practice', '② 練習', '選選看、拼拼看，答錯也沒關係', 'practice')}
      ${step('test', '③ 測驗', p.test != null ? `上次 ${p.test} 分（共 ${ws0.length} 題）` : `${ws0.length} 題，做完就完成今天`, 'test')}
    </section>
    <section class="box">
      <h2>複習</h2>
      <div class="hint">${due.length ? `有 ${due.length} 個字該複習了，每次複習 ${Math.min(PER, due.length)} 題。` : '現在沒有要複習的字 👍'}</div>
      <button class="big blue" data-act="review" ${due.length ? '' : 'disabled'}>🔁 複習（${Math.min(PER, due.length)} 題）</button>
    </section>
    <button class="big alt" data-act="records">📊 看練習和測驗記錄</button>`;
  document.getElementById('dayPick').onchange = e => { viewDay = +e.target.value; home(); };
}

// ---------- 單字卡 ----------
let cardS = null;
function startCards() {
  const v = getView(); cardS = { day: v, list: dayWords(v), i: 0, seen: new Set() }; card();
}
function card() {
  const c = cardS, x = c.list[c.i], ex = EX[x.w], emo = PIC[x.w] || '';
  c.seen.add(x.w);
  $app.innerHTML = `
    <section class="box card">
      <div class="qnum">第 ${c.day} 天・${c.i + 1} / ${c.list.length}</div>
      <div class="emo">${emo}</div>
      <div class="en">${esc(x.w)}</div>
      <div><span class="pos">${esc(x.pos)}</span>${inBook(x.w) ? ' <span class="pos" style="background:#e3f2fd;color:#1565c0">📘 課本有出現</span>' : ''}</div>
      <div class="zh">${esc(x.zh)}</div>
      <button class="say" data-full="${esc(x.w)}">🔊 聽發音和意思</button>
      ${ex ? `<div class="ex">${esc(ex[0])}<small>${esc(ex[1])}</small><button class="say" style="font-size:16px;padding:6px 12px;margin:8px 0 0" data-say="${esc(ex[0])}">🔊 聽例句</button></div>` : ''}
    </section>
    <a class="big blue" style="text-align:center;text-decoration:none" href="${writeWordUrl(x.w, c.day, c.i)}">✍️ 寫寫看這個字<small>看、描、自己寫，寫好會回到這裡</small></a>
    <div class="nav">
      <button class="big alt" data-act="cprev" ${c.i === 0 ? 'disabled' : ''} style="text-align:center">◀ 上一個</button>
      ${c.i < c.list.length - 1 ? `<button class="big" data-act="cnext" style="text-align:center">下一個 ▶</button>` : `<button class="big green" data-act="cdone" style="text-align:center">看完了 ✔</button>`}
    </div>`;
  speakFull(x);
}
function cardsDone() {
  const c = cardS, p = pg(c.day); p.cards = true;
  c.list.forEach(x => { ws(x.w).seen++; ws(x.w).last = today(); });
  prac.data.sessions.push({ t: new Date().toISOString(), day: c.day, kind: 'cards', n: c.list.length, right: null });
  plan.save(); prac.save(); home();
}

// ---------- 題目 ----------
const TYPES = ['zh', 'listen', 'spell'];
const spellable = w => /^[A-Za-z]{2,12}$/.test(w);
function pickType(w, hint) { let t = TYPES[hint % 3]; if (t === 'spell' && !spellable(w)) t = 'zh'; return t; }
function distractZh(x) {
  const pool = WORDS.filter(y => y.w !== x.w && y.short !== x.short && !y.short.includes(x.short) && !x.short.includes(y.short));
  const same = shuffle(pool.filter(y => y.pos === x.pos)), other = shuffle(pool.filter(y => y.pos !== x.pos));
  return same.concat(other).slice(0, 3);
}
function distractEn(x) {
  const pool = WORDS.filter(y => y.w !== x.w);
  const near = shuffle(pool.filter(y => y.w[0].toLowerCase() === x.w[0].toLowerCase() && Math.abs(y.w.length - x.w.length) <= 2));
  return near.concat(shuffle(pool)).slice(0, 3);
}

// session = { kind:'practice'|'test'|'review', day, queue:[{w,type}], i, items:[], retried:Set }
let S = null;
function startSession(kind, day, words) {
  const list = words.map(x => typeof x === 'string' ? WMAP.get(x) : x).filter(Boolean);
  let queue;
  if (kind === 'practice') {   // 每個字兩種題型：一輪一種
    const a = shuffle(list).map((x, i) => ({ w: x.w, type: pickType(x.w, i) })), b = shuffle(list).map((x, i) => ({ w: x.w, type: pickType(x.w, i + 1) }));
    queue = a.concat(b);
  } else {
    queue = shuffle(list).map((x, i) => ({ w: x.w, type: pickType(x.w, i) }));
  }
  S = { kind, day, queue, i: 0, items: [], retried: new Set(), n0: queue.length, answered: false, tiles: null };
  question();
}
const KIND_NAME = { practice: '練習', test: '測驗', review: '複習' };
function question() {
  const q = S.queue[S.i], x = WMAP.get(q.w), emo = PIC[x.w] || '';
  S.answered = false; S.fails = 0;
  const head = `<div class="qnum">${KIND_NAME[S.kind]}・第 ${S.i + 1} 題 / 共 ${S.queue.length} 題</div><div class="prog"><div style="width:${S.i / S.queue.length * 100}%"></div></div>`;
  let body = '';
  if (q.type === 'zh') {
    const opts = shuffle([x, ...distractZh(x)]);
    body = `<div class="qtext"><span class="emo">${emo}</span><span class="w">${esc(x.w)}</span></div>
      <div class="say2"><button class="say" data-say="${esc(x.w)}">🔊 聽發音</button></div>
      ${opts.map(o => `<button class="opt" data-opt="${esc(o.w)}">${esc(o.short)}</button>`).join('')}`;
  } else if (q.type === 'listen') {
    const opts = shuffle([x, ...distractEn(x)]);
    body = `<div class="qtext">聽一聽，是哪一個字？</div>
      <div class="say2"><button class="say" data-say="${esc(x.w)}" style="font-size:30px;padding:16px 28px">🔊</button></div>
      ${opts.map(o => `<button class="opt" data-opt="${esc(o.w)}">${esc(o.w)}</button>`).join('')}`;
  } else {
    const letters = shuffle([...x.w]);
    S.tiles = { want: x.w, got: [], used: [] };
    body = `<div class="qtext"><span class="emo">${emo}</span>${esc(x.short)}<small style="display:block;font-size:16px;color:#8a6a50">拼出英文（${x.w.length} 個字母）</small></div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles">${letters.map((ch, k) => `<button data-tile="${k}" data-ch="${esc(ch)}">${esc(ch)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="mini" data-act="tundo">⌫ 刪掉一個</button><button class="mini" data-act="tclear">重來</button><button class="mini" data-say="${esc(x.w)}">🔊 聽發音</button></div>`;
  }
  $app.innerHTML = `<section class="box">${head}${body}<div class="fb" id="fb"></div><div id="next"></div></section><button class="mini" data-act="quit">先離開</button>`;
  if (q.type === 'spell') drawSlots();
  if (q.type === 'listen') setTimeout(() => speak(x.w), 300);
}
function drawSlots() {
  const t = S.tiles;
  document.getElementById('slots').innerHTML = [...t.want].map((_, i) => `<span>${t.got[i] ? esc(t.got[i]) : ''}</span>`).join('');
  document.querySelectorAll('#tiles button').forEach(b => b.disabled = t.used.includes(+b.dataset.tile) || S.answered);
}
function tileTap(b) {
  const t = S.tiles; if (S.answered || t.got.length >= t.want.length) return;
  t.got.push(b.dataset.ch); t.used.push(+b.dataset.tile); drawSlots();
  if (t.got.length === t.want.length) answer(t.got.join('') === t.want, t.got.join(''));
}
function answer(ok, given) {
  if (S.answered) return;
  S.answered = true;
  const q = S.queue[S.i], x = WMAP.get(q.w);
  S.items.push({ w: q.w, type: q.type, ok, ans: given });
  const st = ws(q.w); st.last = today();
  if (ok) st.right++; else st.wrong++;
  if (S.kind !== 'practice') {   // 測驗和複習才調整複習時間：答對隔幾天再來，答錯明天再來
    if (ok) { st.box = Math.min(st.box + 1, BOX_DAYS.length); st.due = addDays(today(), BOX_DAYS[st.box - 1]); }
    else { st.box = 0; st.due = addDays(today(), 1); }
  } else if (!ok && !st.due) st.due = addDays(today(), 1);
  const fb = document.getElementById('fb');
  fb.innerHTML = ok ? '<span style="color:#2e7d32">✔ 答對了！太棒了！</span>' : `<span style="color:#b26a00">再記一下：<b>${esc(x.w)}</b> ＝ ${esc(x.short)}</span>`;
  speak(x.w);
  document.querySelectorAll('.opt').forEach(o => { if (o.dataset.opt === q.w) o.classList.add('right'); else if (o.dataset.opt === given) o.classList.add('wrong'); });
  if (!ok && S.kind === 'practice' && !S.retried.has(q.w)) { S.retried.add(q.w); S.queue.push({ w: q.w, type: q.type === 'zh' ? 'listen' : 'zh' }); }   // 練習：答錯的字再出現一次
  const last = S.i >= S.queue.length - 1;
  document.getElementById('next').innerHTML = `<button class="big ${last ? 'green' : ''}" data-act="qnext" style="text-align:center">${last ? '做完了 ✔' : '下一題 ▶'}</button>`;
  prac.save();
}
function sessionDone() {
  hush();
  const right = S.items.filter(i => i.ok).length, total = S.items.length, t = new Date().toISOString();
  const wrongs = [...new Set(S.items.filter(i => !i.ok).map(i => i.w))];
  if (S.kind === 'practice') {
    prac.data.sessions.push({ t, day: S.day, kind: 'practice', n: total, right });
    pg(S.day).practice = true;
  } else {
    quiz.data.tests.push({ id: t, date: today(), day: S.day, kind: S.kind === 'test' ? 'test' : 'review', total, right, items: S.items });
    if (S.kind === 'test') {
      const p = pg(S.day); p.test = right;
      if (!plan.data.done[S.day]) plan.data.done[S.day] = { date: today(), score: right };
    }
    quiz.save();
  }
  prac.data.sessions = prac.data.sessions.slice(-1500);
  plan.save(); prac.save();
  const pct = right / total, face = pct >= .9 ? '🌟' : pct >= .7 ? '👍' : '💪';
  const word = pct >= .9 ? '太棒了！' : pct >= .7 ? '很好！' : '有進步！再練幾次就會了';
  $app.innerHTML = `
    <section class="box">
      <div class="msg">${face} ${KIND_NAME[S.kind]}完成！</div>
      <div class="score">${right} / ${total}</div>
      <div class="msg">${word}</div>
      ${wrongs.length ? `<div class="hint">這些字明天會再出現：</div><div class="chips">${wrongs.map(w => `<span class="again">${esc(w)} ${esc(WMAP.get(w).short)}</span>`).join('')}</div>` : '<div class="hint" style="text-align:center">全部答對 🎉</div>'}
    </section>
    <button class="big green" data-act="home" style="text-align:center">回首頁</button>`;
  S = null;
}

// ---------- 記錄 ----------
function csv(rows) { return '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function records() {
  const cd = currentDay(), tests = quiz.data.tests.slice().reverse(), ss = prac.data.sessions;
  const again = Object.entries(prac.data.words).filter(([w, s]) => s.wrong > s.right || (s.box === 0 && s.wrong)).map(([w]) => w);
  const seen = Object.values(prac.data.words).filter(s => s.seen).length;
  $app.innerHTML = `
    <section class="box">
      <h2>每一天的進度</h2>
      <div class="grid">${Array.from({ length: TOTAL_DAYS }, (_, i) => i + 1).map(n => { const d = plan.data.done[n]; return `<i class="${d ? (d.score >= PER * .7 ? 'd' : 'l') : ''} ${n === cd ? 'cur' : ''}" title="第${n}天">${n}</i>`; }).join('')}</div>
      <div class="hint" style="margin-top:8px">綠色＝完成（7 成以上答對）、黃色＝完成但要多複習、灰色＝還沒做。</div>
    </section>
    <section class="box">
      <h2>數字</h2>
      <div class="hint">完成 ${Object.keys(plan.data.done).length} 天・看過 ${seen} 個字・練習 ${ss.filter(s => s.kind === 'practice').length} 次・測驗 ${quiz.data.tests.length} 次<br>開始日期 ${esc(plan.data.start)}</div>
    </section>
    <section class="box">
      <h2>測驗記錄</h2>
      ${tests.length ? `<table><tr><th>日期</th><th>第幾天</th><th>種類</th><th>分數</th></tr>${tests.slice(0, 40).map(t => `<tr><td>${esc(t.date)}</td><td>${t.kind === 'test' ? '第 ' + t.day + ' 天' : '—'}</td><td>${t.kind === 'test' ? '測驗' : '複習'}</td><td>${t.right} / ${t.total}</td></tr>`).join('')}</table>` : '<div class="hint">還沒有測驗。</div>'}
    </section>
    <section class="box">
      <h2>要再練的字（${again.length}）</h2>
      <div class="chips">${again.length ? again.map(w => `<span class="again">${esc(w)} ${esc(WMAP.get(w)?.short || '')}</span>`).join('') : '<span>目前沒有 👍</span>'}</div>
      ${again.length ? `<button class="big blue" data-act="reviewAgain">練這些字（${Math.min(PER, again.length)} 題）</button>` : ''}
    </section>
    ${ORD ? `<section class="box">
      <h2>單字順序</h2>
      <div class="hint">現在：<b>${plan.data.order === 'book' ? '國一、國二課本常用的字先練' : '字母順序'}</b>。課本裡出現的字有 ${ORD.n.inbook} 個，大約 ${Math.ceil(ORD.n.inbook / PER)} 天學完；之後才是其他的字。</div>
      <button class="big alt" data-act="swapOrder">${plan.data.order === 'book' ? '換成字母順序' : '換成課本常用字優先'}</button>
    </section>` : ''}
    <section class="box">
      <h2>記錄檔</h2>
      <div class="hint">資料自動存在電腦的 data 資料夾：<br>gept-plan.json（進度）、gept-practice.json（練習記錄）、gept-quiz.json（測驗記錄）。也可以下載成 Excel 可開的表格：</div>
      <button class="big alt" data-act="csvPrac">⬇ 下載練習記錄（CSV）</button>
      <button class="big alt" data-act="csvQuiz">⬇ 下載測驗記錄（CSV）</button>
    </section>
    <button class="big green" data-act="home" style="text-align:center">回首頁</button>`;
}
function csvPractice() {
  const rows = [['單字', '中文', '看過次數', '寫字次數', '答對', '答錯', '複習等級', '下次複習', '最後練習']];
  Object.entries(prac.data.words).forEach(([w, s]) => rows.push([w, WMAP.get(w)?.short, s.seen, s.written || 0, s.right, s.wrong, s.box, s.due, s.last]));
  download('gept15-練習記錄-' + today() + '.csv', csv(rows));
}
function csvQuiz() {
  const rows = [['日期時間', '種類', '第幾天', '單字', '題型', '對錯', '作答']];
  const TN = { zh: '看英文選中文', listen: '聽音選字', spell: '拼字' };
  quiz.data.tests.forEach(t => t.items.forEach(i => rows.push([t.id, t.kind === 'test' ? '測驗' : '複習', t.day, i.w, TN[i.type] || i.type, i.ok ? '對' : '錯', i.ans])));
  download('gept15-測驗記錄-' + today() + '.csv', csv(rows));
}

// ---------- 事件 ----------
$app.addEventListener('click', e => {
  const fb = e.target.closest('[data-full]'); if (fb) { speakFull(WMAP.get(fb.dataset.full)); return; }
  const sb = e.target.closest('[data-say]'); if (sb) { speak(sb.dataset.say); return; }
  const ob = e.target.closest('[data-opt]'); if (ob && S && !S.answered) { answer(ob.dataset.opt === S.queue[S.i].w, ob.dataset.opt); return; }
  const tb = e.target.closest('[data-tile]'); if (tb) { tileTap(tb); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'home': viewDay = null; home(); break;
    case 'extra': plan.data.extraToday = today(); plan.save(); viewDay = null; home(); break;
    case 'cards': startCards(); break;
    case 'cprev': cardS.i--; card(); break;
    case 'cnext': cardS.i++; card(); break;
    case 'cdone': cardsDone(); break;
    case 'practice': startSession('practice', getView(), dayWords(getView())); break;
    case 'test': startSession('test', getView(), dayWords(getView())); break;
    case 'review': startSession('review', 0, shuffle(dueWords().slice(0, 40)).slice(0, PER)); break;
    case 'reviewAgain': { const ag = Object.entries(prac.data.words).filter(([w, s]) => s.wrong > s.right || (s.box === 0 && s.wrong)).map(([w]) => w); startSession('review', 0, shuffle(ag).slice(0, PER)); break; }
    case 'qnext': S.i++; S.i < S.queue.length ? question() : sessionDone(); break;
    case 'quit': if (confirm('先離開？這一次不會記錄喔')) { S = null; hush(); home(); } break;
    case 'tundo': if (S && !S.answered && S.tiles.got.length) { S.tiles.got.pop(); S.tiles.used.pop(); drawSlots(); } break;
    case 'tclear': if (S && !S.answered) { S.tiles.got = []; S.tiles.used = []; drawSlots(); } break;
    case 'records': records(); break;
    case 'swapOrder':
      if (confirm('換順序後，每一天的字會不一樣，要從第 1 天重新開始。\n\n（你已經練過、測驗過的記錄都會留著）\n\n要換嗎？')) {
        plan.data.order = plan.data.order === 'book' ? 'abc' : 'book';
        plan.data.done = {}; plan.data.prog = {}; plan.data.extraToday = ''; viewDay = null;
        applyOrder(plan.data.order); plan.save(); records();
      }
      break;
    case 'csvPrac': csvPractice(); break;
    case 'csvQuiz': csvQuiz(); break;
  }
});

(async () => {
  $app.innerHTML = '<div class="hint" style="padding:20px;text-align:center">讀取中…</div>';
  await Promise.all([plan.load(), prac.load(), quiz.load()]);
  if (!plan.data.start) plan.data.start = dstr();
  if (!plan.data.order) plan.data.order = Object.keys(plan.data.done).length || !ORD ? 'abc' : 'book';   // 舊進度（已經照字母順序學過）維持原樣
  applyOrder(plan.data.order);
  plan.save();
  const q = new URLSearchParams(location.search);
  if (q.get('resume') === 'cards') {   // 從寫字練習回來：接著看下一個單字
    const day = +q.get('day') || 1, i = +q.get('i') || 0, list = dayWords(day);
    history.replaceState(null, '', 'index.html');
    viewDay = day; cardS = { day, list, i, seen: new Set() };
    if (q.get('wrote') === '1' && list[i]) {
      const st = ws(list[i].w); st.written = (st.written || 0) + 1; st.last = today();
      prac.data.sessions.push({ t: new Date().toISOString(), day, kind: 'write', n: 1, right: null, w: list[i].w });
      prac.save();
      if (i >= list.length - 1) { cardsDone(); return; }   // 最後一個字也寫完了：步驟一完成
      cardS.i = i + 1;
    }
    card(); return;
  }
  home();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
